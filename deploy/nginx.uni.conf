# 小程序 H5 静态服务（收单工作台，仅测试/网页形态使用）
# 仅提供 H5 页面；所有 API 与图片由前端跨域调用 3006 统一后端网关
# 正式微信小程序为打包产物，不经过此入口
server {
    listen 3007;
    server_name 81.71.150.152;

    # 小程序 H5 静态文件（构建产物，根路径部署）
    location / {
        root /home/fpd/m/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
